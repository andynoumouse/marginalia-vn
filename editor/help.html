<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia VN reference</title>
<link rel="stylesheet" href="help.css">
<style>
  :root { --ink: #0e1117; --panel: #171b23; --line: #2a303c; --text: #e6e9ef; --muted: #8b93a3;
    --accent: #5fd1c3; --warn: #e8b64c; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <!-- The F1 help in a window of its own: help.html?doc=commands|game-json|rig-json#topic -->
  <script type="module" src="../dist/editor/help-page.js"></script>
</body>
</html>
