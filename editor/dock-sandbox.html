<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dock sandbox</title>
<style>
  :root { --ink: #0e1117; --panel: #171b23; --line: #2a303c; --text: #e6e9ef; --muted: #8b93a3; --accent: #5fd1c3; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #zones { flex: 1; display: grid; grid-template-columns: 240px 1fr 280px; gap: 8px; padding: 8px; min-height: 0; }
  .zone { display: flex; flex-direction: column; gap: 8px; min-height: 120px; border: 1px dashed var(--line); border-radius: 6px; padding: 6px; overflow: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .panel h2 { margin: 0; padding: 6px 10px; font-size: 13px; cursor: grab; user-select: none; touch-action: none; }
  .panel .body { padding: 8px 10px; color: var(--muted); }
  .panel.dock-dragging { opacity: .5; }
  [data-dock-handle]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header><strong>Dock sandbox</strong><span style="color:var(--muted)">Drag a title, or focus it and press Alt+arrows. The stage stays in the center.</span>
  <button id="reset">Reset layout</button><button id="hide">Toggle Warp</button></header>
<div id="zones">
  <div class="zone" id="z-left"></div>
  <div class="zone" id="z-center"></div>
  <div class="zone" id="z-right"></div>
</div>
<script type="module" src="../dist/editor/dock-sandbox.js"></script>
</body>
</html>
