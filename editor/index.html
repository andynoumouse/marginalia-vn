<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia VN</title>
<link rel="stylesheet" href="help.css">
<style>
  :root { --ink: #0e1117; --panel: #171b23; --line: #2a303c; --text: #e6e9ef; --muted: #8b93a3;
    --accent: #5fd1c3; --warn: #e8b64c; --bad: #f0707a; --right: 46%; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  #bar label { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  #bar .group { display: flex; align-items: center; gap: 6px; padding-left: 10px; border-left: 1px solid var(--line); }
  #bar strong + .group { border-left: 0; padding-left: 0; margin-left: 4px; }
  #bar .group.right { margin-left: auto; }
  #bar button.primary { border-color: var(--accent); color: var(--accent); }
  #status { min-width: 0; max-width: 140px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar strong { white-space: nowrap; }
  #problems[data-errors]:not([data-errors="0"]) { color: var(--bad); border-color: var(--bad); }
  #problems[data-errors="0"]:not([data-warns="0"]) { color: var(--warn); border-color: var(--warn); }
  #problems[data-errors="0"][data-warns="0"] { color: var(--muted); }

  #main { position: absolute; inset: 44px 0 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr) 6px var(--right); grid-template-rows: minmax(0, 1fr); }
  #main > #sidebar { grid-column: 1; } #main > #left { grid-column: 2; } #main > #split { grid-column: 3; } #main > #preview { grid-column: 4; }
  #left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--panel); overflow-x: auto; }
  #tabs .tab { display: flex; align-items: center; flex: none; border: 1px solid var(--line); border-bottom: 0; border-radius: 4px 4px 0 0; color: var(--muted); }
  #tabs .tab button { border: 0; border-radius: 0; background: none; color: inherit; }
  #tabs .tab .close { padding: 4px 6px; opacity: .55; }
  #tabs .tab .close:hover, #tabs .tab[data-selected="true"] .close { opacity: 1; }
  #tabs .tab:hover { border-color: var(--muted); }
  #tabs .tab[data-selected="true"] { color: var(--text); background: var(--ink); border-color: var(--muted); }
  #tabs .tab[data-errors="true"] { color: var(--bad); }
  #work { flex: 1; min-height: 0; display: flex; }
  #editor { flex: 1; min-width: 0; min-height: 0; }
  #sidebar { width: 240px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
  #sidebar[hidden] { display: none; }
  #sbHead { display: flex; align-items: center; }
  #sbHead input { flex: 1; min-width: 0; }
  #sidebar input { margin: 6px; font: inherit; color: var(--text); background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
  #sbList { flex: 1; overflow-y: auto; padding: 0 4px 8px; }
  /* Git: branch, changed-file count and Commit (editor/git-dialog.ts). */
  #sbGit { display: flex; align-items: center; gap: 8px; margin: 0 6px 4px; font-size: 12px; color: var(--muted); }
  #sbGit[hidden] { display: none; }
  #sbGit .gb-branch { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sbGit .gb-count { flex: none; }
  #sbGit .gb-commit { flex: none; margin-left: auto; padding: 1px 8px; font-size: 12px; }
  #gitCommit { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #gitCommit[hidden] { display: none; }
  #gitCommit .gd-card { width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #gitCommit header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #gitCommit header .gd-branch { color: var(--muted); }
  #gitCommit header .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  #gitCommit .gd-note { margin: 8px 12px 0; padding: 6px 10px; border-left: 3px solid var(--warn); background: rgba(255,255,255,.03); }
  #gitCommit .gd-note[data-kind="blocker"] { border-color: var(--bad); }
  #gitCommit .gd-summary { padding: 8px 12px 6px; color: var(--muted); }
  #gitCommit .gd-rows { flex: 1; min-height: 40px; max-height: 320px; overflow-y: auto; border-top: 1px solid var(--line); }
  #gitCommit .gd-row { display: flex; align-items: baseline; gap: 10px; padding: 3px 12px; border-bottom: 1px solid var(--line); }
  #gitCommit .gd-kind { flex: none; width: 64px; font-size: 11px; text-transform: uppercase; color: var(--muted); }
  #gitCommit .gd-kind[data-kind="added"] { color: var(--accent); }
  #gitCommit .gd-kind[data-kind="deleted"], #gitCommit .gd-kind[data-kind="conflict"] { color: var(--bad); }
  #gitCommit .gd-path { min-width: 0; overflow-wrap: anywhere; }
  #gitCommit .gd-from { color: var(--muted); font-size: 12px; }
  #gitCommit .gd-label { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px 0; color: var(--muted); }
  #gitCommit .gd-message { font: inherit; color: var(--text); background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; resize: vertical; }
  #gitCommit .gd-foot { display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 8px 12px; }
  #gitCommit .gd-result { padding: 8px 12px; border-top: 1px solid var(--line); white-space: pre-wrap; }
  #gitCommit .gd-result[hidden], #gitCommit .gd-foot [hidden] { display: none; }
  #gitCommit .gd-result[data-state="failed"] { color: var(--bad); }
  #sbList h3 { display: flex; align-items: center; gap: 2px; min-height: 22px; margin: 8px 0 0; padding: 0 2px 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #sbList h3 > span { flex: 1; min-width: 0; }
  #sbList h3 > .fold { cursor: pointer; user-select: none; border-radius: 3px; }
  #sbList h3 > .fold::before { content: "\25BE"; display: inline-block; width: 12px; }
  #sbList h3 > .fold[aria-expanded="false"]::before { content: "\25B8"; }
  #sbList h3 > .fold:hover { color: var(--text); }
  #sbList details > summary { cursor: pointer; padding: 2px 6px; color: var(--muted); }
  #sbList .item { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 2px 8px; border: 0; background: none; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  #sbList .row { display: flex; align-items: center; }
  #sbList .row .item { flex: 1; min-width: 0; }
  #sbList .row .anim { flex: none; margin-right: 6px; padding: 1px 8px; font-size: 12px; }
  #sbList details .item { padding-left: 20px; }
  #sbList details details { margin-left: 12px; }
  #sbList details details .item { padding-left: 20px; }
  #sbList summary { display: flex; align-items: center; gap: 2px; list-style: none; }
  #sbList summary::-webkit-details-marker { display: none; }
  #sbList summary::before { content: "▸"; flex: none; width: 14px; font-size: 11px; transition: transform .1s; }
  #sbList details[open] > summary::before { transform: rotate(90deg); }
  #sbList summary > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* Hover icons on headings and folders (new file, new folder, add files): hidden until the row is hovered or focused. */
  #sbList .add { flex: none; display: grid; place-items: center; width: 22px; height: 20px; padding: 0; border: 0; background: none; color: var(--muted); border-radius: 3px; visibility: hidden; }
  #sbList :is(summary, h3):is(:hover, :focus-within) .add { visibility: visible; }
  #sbList .add:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .ctxmenu { position: fixed; z-index: 50; min-width: 180px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
  .ctxmenu[hidden] { display: none; }
  .ctxmenu button { display: block; width: 100%; padding: 4px 10px; border: 0; border-radius: 4px; background: none; color: var(--text); text-align: left; white-space: nowrap; }
  .ctxmenu button:is(:hover, :focus) { background: rgba(95, 209, 195, .16); outline: none; }
  .ctxmenu button:disabled { color: var(--muted); }
  .ctxmenu .sep { height: 1px; margin: 4px 6px; background: var(--line); }
  #sbList .item:hover { background: rgba(255,255,255,.06); }
  #sbList .item[aria-current="true"] { background: rgba(95, 209, 195, .16); }
  #sbList .item[data-errors="true"] { color: var(--bad); }
  #sbList .item .meta { color: var(--muted); font-size: 12px; }
  #sbList .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; text-align: center; color: #111; }
  #sbList .badge.errors { background: var(--bad); }
  #sbList .badge.warns { background: var(--warn); }
  #sbList .none { padding: 4px 8px; color: var(--muted); }
  #sbList .dropping { outline: 1px dashed var(--accent, #5fd1c3); outline-offset: -2px; }
  #sbList details.drop { background: rgba(95, 209, 195, .16); }
  #split { background: var(--line); cursor: col-resize; }
  #split:hover, #split.drag { background: var(--accent); }
  #preview { width: 100%; height: 100%; border: 0; background: #06080b; }
  #fatal { padding: 24px; color: var(--bad); }
  #left { position: relative; }
  /* What a file action did, with its Undo (delete and replace go to the project trash). */
  #toast { position: absolute; bottom: 14px; left: 50%; translate: -50% 0; z-index: 25; display: flex; align-items: center; gap: 10px;
    max-width: calc(100% - 24px); padding: 6px 8px 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
  #toast[hidden] { display: none; }
  #toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast[data-kind="error"] { border-color: var(--bad); width: max-content; max-width: min(480px, calc(100% - 24px)); }
  #toast[data-kind="error"] span { white-space: pre-wrap; overflow-wrap: anywhere; }
  #toast[data-kind="error"] button { border-color: var(--bad); color: var(--bad); }
  #toast button { flex: none; border-color: var(--accent); color: var(--accent); }
  #palette { position: absolute; top: 40px; left: 50%; translate: -50% 0; width: min(620px, calc(100% - 24px)); z-index: 20;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.5); padding: 6px; }
  #palette[hidden] { display: none; }
  #palette input { width: 100%; font: inherit; color: var(--text); background: var(--ink); border: 1px solid var(--accent);
    border-radius: 4px; padding: 6px 8px; outline: none; }
  #palette ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 360px; overflow-y: auto; }
  #palette li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
  #palette li[aria-selected="true"] { background: rgba(95, 209, 195, .16); }
  #palette li b { color: var(--accent); font-weight: 600; }
  #palette .detail { color: var(--muted); font-size: 12px; margin-left: 10px; }
  #palette .hint { color: var(--muted); font-size: 12px; white-space: pre; flex: none; }
  #palette .create { color: var(--accent); }
  #palette .empty { color: var(--muted); cursor: default; }
  #vars { border-top: 1px solid var(--line); background: var(--panel); max-height: 30%; display: flex; flex-direction: column; }
  #vars[hidden] { display: none; }
  #vars header { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; color: var(--muted); }
  #varsList { margin: 0; padding: 2px 10px 8px; overflow: auto; display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px;
    font: 12px/1.45 ui-monospace, Consolas, monospace; }
  #varsList dt { color: var(--muted); } #varsList dd { margin: 0; }
  #varsList dd { cursor: text; } #varsList input.varEdit { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: var(--bg, transparent); border: 1px solid var(--accent); padding: 0 2px; }
  #varsList dd.changed { color: var(--accent); } #varsList .none { grid-column: 1 / -1; color: var(--muted); }
  #findAll { border-top: 1px solid var(--line); background: var(--panel); max-height: 45%; display: flex; flex-direction: column; }
  #findAll[hidden] { display: none; }
  #findAll header { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; color: var(--muted); }
  #findAll .find-row { display: flex; gap: 6px; padding: 2px 8px 4px; align-items: center; flex-wrap: wrap; }
  #findAll input[type=text] { flex: 1 1 140px; min-width: 0; font: inherit; color: inherit; background: var(--bg, transparent); border: 1px solid var(--line); padding: 2px 4px; }
  #findAll label { color: var(--muted); white-space: nowrap; }
  #findSummary { padding: 0 10px 4px; color: var(--muted); }
  #findResults { overflow: auto; padding: 0 4px 6px; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  #findResults .find-file { padding: 4px 6px 0; color: var(--accent); }
  #findResults .find-hit { display: grid; grid-template-columns: 4ch 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 0 6px; white-space: pre; overflow: hidden; }
  #findResults .find-hit:hover { background: rgba(255,255,255,.08); }
  #findResults mark { background: rgba(95,209,195,.35); color: inherit; }
  #findResults .find-more { padding: 4px 6px; color: var(--muted); }
  #taskOutput { border-top: 1px solid var(--line); background: var(--panel); max-height: 40%; display: flex; flex-direction: column; }
  #taskOutput[hidden] { display: none; }
  #taskOutput header { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; color: var(--muted); }
  #taskOutput pre { margin: 0; padding: 6px 10px 10px; overflow: auto; min-height: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  #taskOutput pre a { color: var(--accent); }
  #translations { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #translations[hidden] { display: none; }
  #translations .tr-card { width: min(1200px, 100%); height: min(820px, 100%); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #translations header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #translations header .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  #translations .tr-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; }
  #translations .tr-bar label { color: var(--muted); white-space: nowrap; }
  #translations .tr-filter { flex: 1 1 200px; min-width: 0; }
  #translations .tr-ids { display: flex; align-items: center; gap: 10px; margin: 0 12px 6px; padding: 6px 10px; border: 1px solid var(--warn); border-radius: 4px; }
  #translations .tr-ids[hidden] { display: none; }
  #translations .tr-summary { padding: 0 12px 6px; color: var(--muted); }
  #translations .tr-scroll { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); position: relative; }
  #translations .tr-spacer { position: relative; }
  #translations .tr-row { position: absolute; left: 0; right: 0; height: 88px; box-sizing: border-box; display: grid; grid-template-columns: 170px 1fr 1fr; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  #translations .tr-ctx { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 12px; color: var(--muted); }
  #translations .tr-where { all: unset; cursor: pointer; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #translations .tr-where:hover { text-decoration: underline; }
  #translations .tr-row[data-outdated="true"] { background: color-mix(in srgb, var(--warn) 12%, transparent); }
  #translations .tr-was { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #translations .tr-ok { align-self: flex-start; font-size: 11px; padding: 1px 6px; }
  #translations .tr-src { overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  #translations .tr-edit { resize: none; font: inherit; line-height: 1.4; color: inherit; background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  #translations .tr-edit[data-empty="true"] { border-color: var(--warn); }
  #voice { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #voice[hidden] { display: none; }
  #voice .vo-card { width: min(1200px, 100%); height: min(820px, 100%); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #voice header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #voice header .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  #voice .vo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; }
  #voice .vo-bar label { color: var(--muted); white-space: nowrap; }
  #voice .vo-filter { flex: 1 1 200px; min-width: 0; }
  #voice .vo-summary, #voice .vo-note { padding: 0 12px 6px; color: var(--muted); }
  #voice .vo-note[hidden], #voice .vo-ask[hidden], #voice .vo-unmatched[hidden] { display: none; }
  #voice .vo-ask, #voice .vo-unmatched { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 12px 6px; padding: 6px 10px; border: 1px solid var(--warn); border-radius: 4px; }
  #voice .vo-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #voice .vo-chip { cursor: grab; padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--ink); }
  #voice .vo-scroll { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); position: relative; }
  #voice .vo-scroll[data-drop="true"] { outline: 2px dashed var(--accent); outline-offset: -4px; }
  #voice .vo-spacer { position: relative; }
  #voice .vo-row { position: absolute; left: 0; right: 0; height: 96px; box-sizing: border-box; display: grid; grid-template-columns: 170px 1fr 150px; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  #voice .vo-row[data-status="outdated"] { background: color-mix(in srgb, var(--warn) 12%, transparent); }
  #voice .vo-row[data-status="missing"] .vo-status { color: var(--warn); }
  #voice .vo-row[data-drop="true"] { outline: 2px dashed var(--accent); outline-offset: -3px; }
  #voice .vo-ctx { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 12px; color: var(--muted); }
  #voice .vo-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #voice .vo-where { all: unset; cursor: pointer; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #voice .vo-where:hover { text-decoration: underline; }
  #voice .vo-text { overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  #voice .vo-tag { display: block; color: var(--muted); font-size: 11px; }
  #voice .vo-act { display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
  #voice .vo-act button { font-size: 12px; padding: 1px 6px; }
  #themePanel { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #themePanel[hidden] { display: none; }
  #themePanel .td-card { width: min(1200px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #themePanel header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #themePanel .td-tabs { display: flex; gap: 4px; margin-left: auto; }
  #themePanel .td-tabs button[aria-pressed="true"] { border-color: var(--accent, #5fd1c3); }
  #themePanel .td-main { display: grid; grid-template-columns: minmax(0, 1fr) 756px; min-height: 0; flex: 1; }
  #themePanel .td-body { overflow-y: auto; padding: 8px 12px 12px; min-height: 0; }
  #themePanel .td-gallery { overflow-y: auto; overflow-x: hidden; padding: 8px 12px 12px; border-left: 1px solid var(--line); display: grid; grid-template-columns: repeat(2, 340px); gap: 14px 12px; align-content: start; }
  #themePanel .td-gallery figure { margin: 0; }
  #themePanel .td-gallery iframe { display: block; border: 1px solid var(--line); border-radius: 4px; background: #000; cursor: pointer; }
  #themePanel .td-gallery figcaption { color: var(--muted); font-size: 12px; padding-top: 2px; }
  @media (max-width: 1000px) { #themePanel .td-main { grid-template-columns: 1fr; } #themePanel .td-gallery { border-left: 0; border-top: 1px solid var(--line); grid-template-columns: repeat(auto-fill, 340px); } }

    </div>
    <span id="status">loading...</span>
  </div>
  <div id="main">
    <aside id="sidebar" hidden aria-label="Project files">
      <div id="sbHead">
        <input id="sbFilter" type="search" placeholder="Filter files and assets" aria-label="Filter files and assets">
      </div>
      <div id="sbGit" hidden></div>
      <div id="sbList"></div>
    </aside>
    <div id="left">
      <div id="toast" role="status" hidden><span></span><button type="button">Undo</button></div>
      <div id="tabs" role="tablist"></div>
      <div id="work">
        <div id="editor"></div>
      </div>
      <section id="vars" hidden aria-label="Story variables">
        <header><span>Variables (live)</span><button id="varsClose" type="button" aria-label="Close variables">Close</button></header>
        <dl id="varsList"></dl>
      </section>
      <section id="findAll" hidden aria-label="Find in files">
        <header><span>Find in files</span><button id="findClose" type="button" aria-label="Close find">Close</button></header>
        <div class="find-row">
          <input id="findText" type="text" placeholder="Find" aria-label="Find" spellcheck="false">
          <label><input id="findCase" type="checkbox"> Aa</label>
          <label><input id="findWord" type="checkbox"> Word</label>
          <label><input id="findRegex" type="checkbox"> .*</label>
        </div>
        <div class="find-row">
          <input id="replaceText" type="text" placeholder="Replace with" aria-label="Replace with" spellcheck="false">
          <button id="replaceAll" type="button">Replace all</button>
        </div>
        <div id="findSummary"></div>
        <div id="findResults"></div>
      </section>
      <section id="taskOutput" hidden aria-label="Task output">
        <header><span>Output</span><button id="taskOutputClose" type="button" aria-label="Close output">Close</button></header>
        <pre id="taskOutputText"></pre>
      </section>
    </div>
    <div id="split" role="separator" aria-orientation="vertical"></div>
    <iframe id="preview" src="../" title="Live preview" allow="gamepad; fullscreen" allowfullscreen></iframe>
  </div>
  <script src="../vendor/monaco/vs/loader.js"></script>
  <script type="module" src="../dist/editor/editor.js"></script>
</body>
</html>
